[package]
name = "succinct"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3"
chrono = { version = "0.4.44", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "from", "into"] }
futures = "0.3.32"
inotify = "0.10"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
confy = "2.0.0"
toml = "1.0.7"
tokio = { version = "1.53.1", features = ["full"]}
tokio-stream = "0.1.19"
directories = "6.0.0"
globset = "0.4.20"
figment = "0.10.19"
const_format = "0.2.36"
object_store = { version = "0.14.2", features = ["aws", "tokio"] }
thiserror = "2.0.21"
num_enum = "0.7.6"
strum = { version = "0.28.0", features = ["derive"] }
async-compression = { version = "0.4.48", features = ["tokio", "zstd"] }
tokio-tar = "0.3.1"
clap = "4.6.7"
camino = { version = "1.2.6", features = ["serde1"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32", "xxh64"] }
serde-inline-default = "1.0.2"
redb = "4.3.0"
redb-derive = "0.1.0"
async-walkdir = "2.2.0"
ref-cast = "1.0.27"
tokio-util = "0.7.19"
debounced = "0.2.0"
paste = "1.0.15"
reqwest = "0.13.5"
log = "0.4.34"
async-tempfile = "0.8.0"
futures-util = "0.3.34"
nix = { version = "0.31.3", features = ["fs"] }
serde-nixos = "0.3.1"


